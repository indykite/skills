---
# Runs the harness `./testing/e2e-ciq.sh` against every skill on every push to
# main/master. Fails the build if any structural check (spec, loader, scripts,
# assets, hygiene) or --print smoke test fails.

name: validate-skills

# Quoted so yamllint's `truthy` rule doesn't treat `on` as YAML 1.1 boolean.
"on":
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'LICENSE'
      - '.gitignore'
      - '.lycheeignore'
      - '.pre-commit-config*.yaml'
      - '.yamllint.yml'
      - '.trivy.yaml'
      - '.deepsource.toml'
  workflow_dispatch: {}

# Pinned so an unintended push to upstream `agentskills` can't break every PR.
# Bump deliberately; the bump PR itself surfaces any breakage.
env:
  SKILLS_REF_SHA: 2d3e01f590f68bee2cb76a3200823e93b2cc9eaa

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      # Actions pinned by SHA; trailing comment is the semver at pin time.
      - name: Checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 - https://github.com/actions/setup-python/releases
        with:
          python-version: '3.14'

      # pipx 1.5+ uses the XDG-compliant ~/.local/share/pipx tree (PIPX_HOME),
      # not the older ~/.local/pipx. We cache that whole tree; the install
      # step asks pipx for the actual path at runtime via `pipx environment`,
      # so this stays correct even if pipx changes its default location.
      - name: Cache pipx (skills-ref)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 - https://github.com/actions/cache/releases
        id: cache-pipx
        with:
          path: ~/.local/share/pipx
          key: pipx-skills-ref-${{ env.SKILLS_REF_SHA }}-py3.14

      - name: Install skills-ref
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pipx
          # Ask pipx where venvs live rather than hardcoding — pipx 1.12 on
          # GH runners doesn't reliably create the `~/.local/bin` symlink
          # under the non-interactive shell, but the venv path itself is
          # always queryable and deterministic.
          venvs_dir=$(pipx environment --value PIPX_LOCAL_VENVS)
          skills_ref_bin="${venvs_dir}/skills-ref/bin"
          if [[ ! -x "${skills_ref_bin}/skills-ref" ]]; then
            # skills-ref is not on PyPI yet; install from the agentskills monorepo.
            pipx install \
              "git+https://github.com/agentskills/agentskills@${SKILLS_REF_SHA}#subdirectory=skills-ref"
          fi
          echo "${skills_ref_bin}" >> "${GITHUB_PATH}"
          "${skills_ref_bin}/skills-ref" --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 - https://github.com/actions/setup-node/releases
        with:
          node-version: lts/*

      - name: Install jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq

      - name: Structural harness (spec + loader + scripts + assets + hygiene)
        run: ./testing/e2e-ciq.sh

      - name: Dry-run harness (--print smoke test on every helper)
        run: ./testing/e2e-ciq.sh --dry-run
