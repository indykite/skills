# IAG starter config.yaml
#
# Copy this file, set every <PLACEHOLDER>, and pass it to the IAG
# container with --config=/app/config.yaml
#
# Per-instance overrides (when running multiple IAG instances):
# change service.name, service.port, service.base_url,
# protected_agent.base_url, protected_agent.authentication.client_id /
# client_secret / audiences, and authzen.input_params / policy_tags when a
# gateway is pinned to some workflows. Everything else, including
# token_service, can stay shared across instances.
#
# The gateway decides admission with ONE AuthZEN evaluation against a KBAC
# admission policy that compares $ik_token.act_chain with a workflow in the
# IKG. It runs no Knowledge Query: contx_iq.query_id is ignored and a
# non-empty contx_iq.allowed_workflow_id stops it at startup.
#
# Field-by-field documentation: see ../references/configuration.md
---
service:
  name: <SERVICE_NAME> # e.g. retriever-iag
  port: <SERVICE_PORT> # e.g. 8888 (the default)
  # REQUIRED in both modes. a2a: public URL of this gateway, written into the
  # agent card it serves. mcp: the full public URL of the MCP endpoint at the
  # gateway, with its path, unencoded (gid:, not gid%3A), no query.
  base_url: <SERVICE_BASE_URL> # e.g. https://retriever-iag.example.com
  environment: <ENVIRONMENT> # demo, staging, prod
  log_level: info # debug, info, warn, error
  # Port of the /healthz, /readyz and /startupz endpoints. Defaults to 9080,
  # which the container image HEALTHCHECK probes - change it only together
  # with that probe.
  # healthcheck_port: 9080
identity_provider:
  base_url: <IDP_BASE_URL>
  introspect_endpoint: oauth-introspect
  client_credential_endpoint: oauth-token
  exchange_endpoint: oauth-token
  # How long before expiry a kept client credentials token is renewed (10s).
  # client_credential_renew_before: 10s
  # REQUIRED in a2a mode: the security scheme named in the served agent card.
  openid_configuration_url: <IDP_OPENID_CONFIGURATION_URL> # e.g. https://idp.example.com/.well-known/openid-configuration
  # REQUIRED in mcp mode: the issuer identifier of the identity provider, as
  # in its metadata and the iss of its tokens; named in the gateway's OAuth
  # protected resource metadata (authorization_servers).
  # issuer: <IDP_ISSUER> # e.g. https://idp.example.com/realms/main
# Optional. Left out, the identity provider above mints the delegation token
# and it replaces the caller's token in Authorization (the agent's own policies
# read $token). Filled in, the IndyKite Token Service mints it: the caller's
# token is forwarded in Authorization (see authorization_header.forward) with the delegation token
# beside it in X-IK-Token ($ik_token), a workflow starts only at the agent the
# user's token was issued for (protected_agent.authentication.audiences), and a
# later hop needs only its X-IK-Token. The admission call carries the
# delegation token in X-IK-Token in both modes.
# Every field but audience is required once the section is present. The
# client_auth values are the Token Service's own idp.client_auth, not the IdP
# credentials below.
# token_service:
#   base_url: <TOKEN_SERVICE_BASE_URL> # e.g. https://token-service.example.com
#   exchange_endpoint: /oauth2/token
#   introspect_endpoint: /oauth2/introspect
#   # Audience of every delegation token; the same on every gateway of a path,
#   # listed in the Token Service's idp.audiences. Defaults to
#   # protected_agent.authentication.audiences.
#   audience: agent-gateway
#   client_auth:
#     type: client_secret_basic # the only supported method
#     client_id: <TOKEN_SERVICE_CLIENT_ID> # e.g. agent-gateway
#     client_secret: <TOKEN_SERVICE_CLIENT_SECRET>
protected_agent:
  # a2a: where the agent card is read (requests go to the card's JSON-RPC URL
  # on this scheme and host). mcp: the FULL URL of the MCP endpoint of the
  # server, with its path, unencoded, e.g. http://mcp-server:8080/mcp/v1/gid:AAAA
  base_url: <PROTECTED_AGENT_BASE_URL> # e.g. http://retriever:6002
  protocol: a2a # a2a (default) or mcp
  # IKG node type of this agent, the resource type of the admission evaluation,
  # used only when the delegation token has no act.type (the Token Service
  # writes its idp.actor_type, Agent by default). A value that differs from the
  # token's act.type refuses every request. Usually left unset.
  # node_type: Agent
  authentication:
    type: credentials
    client_id: <PROTECTED_AGENT_CLIENT_ID> # its token's sub is the agent's name in the chain
    client_secret: <PROTECTED_AGENT_CLIENT_SECRET>
    # Without token_service: audiences requested on the exchange (optional).
    # With token_service: REQUIRED - the audiences of user tokens that may
    # start a workflow at this gateway; any other token is 401.
    # audiences:
    #   - <PROTECTED_AGENT_AUDIENCE> # e.g. agent.retriever
# Optional, a2a: how long the agent card and the client built from it are kept.
# a2a:
#   cache_ttl: 5m
#   cache_update_after: 5m
#   cache_update_after_error: 10s
# Optional, with token_service. forward: what the agent gets in Authorization -
# correct_audience (default: a bearer token only when issued for this agent),
# none, or all (as the caller sent it). same_user_check: refuse a bearer token
# on a later hop whose sub differs from the delegation token's (default true);
# switch off when Authorization carries the calling agent's own token.
# authorization_header:
#   forward: correct_audience
#   same_user_check: true
# Optional IBAC. a2a: ask the Intent Agent about every message before
# forwarding; with token_service the intent is written into act.intent of
# this hop; with capability checks the extended card lists only the skills
# that fit the caller's intent. mcp: check the x-coaz-mappings of each invoked tool, resource or
# prompt when the delegation token carries an intent.
# ibac:
#   enabled: false
#   capabilities:
#     cache_ttl: 5m        # how long a listed capability (MCP) or card skill (A2A) and its mappings are kept
#     unmapped: allow      # allow | deny a capability or skill without a mapping
# intent_agent:
#   base_url: <INTENT_AGENT_BASE_URL> # required with ibac.enabled
#   audience: intent_agent # must match the Intent Agent's EXPECTED_TOKEN_AUDIENCE
#   timeout: 45s
authzen:
  base_url: <INDYKITE_BASE_URL>/access/v1
  # The action the admission policy lists.
  action: CAN_TRIGGER
  # Optional: pin this gateway to some workflows through a tagged copy of the
  # admission policy that reads $workflow_ids.
  # input_params:
  #   workflow_ids: ["wf1"]
  # policy_tags: ["pinned"]
  # subject_types is not read any more: the subject type is the ikg_node_type
  # of the Token Introspect configuration that validates the caller's token.
  # cache_update_after defaults to cache_ttl; cache_update_after_error to
  # min(10s, cache_update_after). Startup fails if any is negative, if
  # cache_update_after > cache_ttl, or if cache_update_after_error >
  # cache_update_after.
  cache_ttl: 5m
  cache_update_after: 5m
  cache_update_after_error: 10s
  # Capability checks, on by default: in front of an MCP server, filter the
  # tools/resources/prompts lists and refuse calls outside the caller's
  # permitted set (403, -31403); in front of an A2A agent, filter the skills of
  # the extended card. Needs HAS edges and one CAN_USE policy per label, or
  # every list is empty. enabled: false restores admission-only behaviour.
  # capabilities:
  #   enabled: true
  #   action: CAN_USE
  #   labels:
  #     tools: Tool
  #     resources: McpResource
  #     prompts: Prompt
  #     skills: Skill
contx_iq:
  base_url: <INDYKITE_BASE_URL>/contx-iq/v1
  # AppAgent credential with the Authorization and ContXIQ API permissions;
  # sent as X-IK-ClientKey to whoami and AuthZEN.
  app_agent_credentials_token: <APP_AGENT_CREDENTIALS_TOKEN>
  # How long a whoami answer is kept (0 keeps none).
  cache_ttl: 5m
  # query_id is ignored; allowed_workflow_id stops the gateway - do not set them.
# Optional: origins a browser may call the token-protected paths from
# (scheme://host[:port], no path; "*" alone allows every origin). Empty by
# default: no origin is allowed. The OAuth metadata paths and the public agent
# card allow every origin regardless.
# cors:
#   allowed_origins:
#     - <BROWSER_CLIENT_ORIGIN> # e.g. https://mcp-client.example.com
# Audit is optional but can only be enabled from a file (JARVIS_AUDIT_* only
# overrides values). Pick one delivery form and delete the other.
audit:
  delivery: webhook
  # Adds the prompt, the reason of a failed task and the model's text answer
  # (in place of an intent) to INTENT records.
  # include_prompt: false
  # Optional buffered delivery for either form; records are drained on
  # shutdown, a full queue drops records with a warning in the service log.
  # async:
  #   buffer_size: 512
  http:
    url: <AUDIT_WEBHOOK_URL>
    method: post # post | put
    auth:
      type: no-auth # no-auth | api-key | mTLS
      # api_key: <API_KEY>
      # api_key_header: X-API-Key # default
      # mtls_certificate_file_path: /run/secrets/cert.pem
      # mtls_private_key_path: /run/secrets/key.pem

# audit:
#   delivery: file
#   file:
#     storage_path: /app/audit            # writable by user 65532
#     format: json                        # csv | json | txt
#     rotation_strategy: size-and-time    # size | time | size-and-time
#     rotation_interval: 24h
#     rotation_max_bytes: 104857600
