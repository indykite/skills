---
# Slim pre-commit config — suitable for public release of this skills repo.
#
# Purpose: the same safety net as the full IndyKite standard config
# (file hygiene, structural safety, script hygiene, JSON, secrets) without the
# tooling weight that an outside contributor would have to install. An external
# contributor who runs `pre-commit run --all-files` against this file only
# needs `pre-commit` itself; everything else is pulled from public hook repos.
#
# Prerequisites:
#   brew install pre-commit yamlfmt yamllint actionlint shellcheck shfmt
#
# Excluded vs the full config (deliberate trims):
#   - markdownlint / yamllint     noisy against default rules; this repo's docs
#                                 use wide tables and long descriptions that
#                                 need suppression configs to lint cleanly.
#   - yamlfmt / shfmt /           auto-fix formatters with semantic side effects
#     pretty-format-json          (shfmt mangled bash array keys during testing;
#                                 yamlfmt and yamllint defaults disagree).
#   - checkov / trivy             SAST/IaC scanners; not relevant to a markdown
#                                 + JSON + bash skills repo.
#   - JS / GitHub-workflow hooks  no JS code, no workflows in this repo.
#   - commitlint /                workflow policy, not strictly necessary.
#     no-commit-to-branch
#   - pre-commit-validate-*       meta hooks; useful but optional.
#
# Use:
#   pre-commit install                                            # local install
#   pre-commit run --all-files                                    # all hooks
#   pre-commit run --all-files --config .pre-commit-config-slim.yaml  # explicit
#
# To switch this in as the default (e.g. on public release), rename it to
# `.pre-commit-config.yaml` and rename the current full config out of the way.
default_stages: [pre-commit]
fail_fast: false
repos:
  # ----------------------------------------------------------------------
  # File hygiene + structural safety + JSON + secrets.
  # ----------------------------------------------------------------------
  - repo: meta
    hooks:
      # - id: check-hooks-apply
      - id: check-useless-excludes
        name: pre-commit/check-useless-excludes
  - repo: ssh://git@github.com/indykite/ops-common
    rev: "279a267e3e7d6319ce8cf8f88bbe6784e46bda07" # using a branch name (or HEAD) is not supported
    hooks:
      # NON-DEFAULT stage, install explicitly with: pre-commit install -t post-checkout
      - id: git-pull
      - id: git-branch-delete-stale

      # pre-commit validations
      # - id: pre-commit-autoupdate # done via 'renovate'; left for reference and possible options
      #   args: [--freeze] # store hashes in 'rev' instead of tag names
      - id: pre-commit-validate-config
      - id: pre-commit-validate-manifest

      # Shellcheck
      - id: shfmt
      - id: shellcheck

  #
  # Renovate
  - repo: https://github.com/renovatebot/pre-commit-hooks # ci:ignore:OK to validate locally only, otherwise it adds 850MB+ to unpacked cache
    rev: "44.5.2"
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    # inspired by https://github.com/antonbabenko/pre-commit-terraform/blob/master/.pre-commit-config.yaml
    rev: v6.0.0
    hooks:
      # Git style
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules
      # - id: forbid-submodules # XXX: either of two is enough
      - id: no-commit-to-branch
        name: no-commit-to-master
        args: [--branch, dev, --branch, master, --branch, main]

      # Common errors
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks

      # Cross platform
      # - id: check-illegal-windows-names
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

      # Format linters
      # 'check-yaml' and 'sort-simple-yaml' disabled intentionally, use hooks below
      - id: check-xml
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]

      # Security
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  # ----------------------------------------------------------------------
  # Gitleaks — broader secret scan than detect-private-key alone.
  # Especially relevant here because skill assets / docs may include
  # placeholder tokens that look real.
  # ----------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ----------------------------------------------------------------------
  # YAML
  - repo: local
    hooks:
      # place any overrides in '.actionlint.yaml' https://github.com/rhysd/actionlint/blob/main/docs/config.md
      #  args: ["-config-file=.actionlint.yaml"]
      - id: actionlint-system
        name: github-actionlint
        language: system
        entry: actionlint
        types: ["yaml"]
        files: ^\.github/workflows/
  # - repo: https://github.com/google/yamlfmt <- "language: golang" slower & takes larger CI cache comparing to "system"
  #   rev: v0.17.2
  - repo: local
    hooks:
      - id: yamlfmt
        name: yamlfmt
        language: system
        entry: yamlfmt
        types: [yaml]
  # - repo: https://github.com/adrienverge/yamllint <- "language: python" slower & takes larger CI cache comparing to "system"
  #   rev: v1.37.1
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        language: system
        entry: yamllint
        args: ["--strict"]
        types: [file, yaml]

  # Lychee — broken-link checker for Markdown.
  # Catches rotted cross-skill links (e.g. `../indykite-mcp-server/SKILL.md`
  # after a rename), broken README anchors, and dead external URLs.
  #
  # Prerequisite: the `lychee` binary must be on PATH (the upstream hook is
  # `language: system`). Install it once with one of:
  #     brew install lychee
  #     cargo install lychee
  #     # or download a release binary from github.com/lycheeverse/lychee
  #
  # Notes:
  # - lychee hits the network for HTTP URLs, so it is slower than the other
  #   hooks (~10-30s on this repo). For tight feedback loops consider
  #   running it in CI on a schedule rather than on every commit.
  # - URLs that should be skipped (e.g. the repo's own GitHub URL while
  #   the repo is still private) live in `.lycheeignore` at the repo root.
  # - Run `pre-commit autoupdate` to pin the latest stable rev.
  # ----------------------------------------------------------------------
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.18.1
    hooks:
      - id: lychee
        # Skip lychee's own config — its regex patterns get mis-parsed as URLs.
        exclude: ^\.lycheeignore$
        args:
          - --no-progress
          - --accept=200,403,429
          - --max-concurrency=5
